<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary">
<!-- Main Container -->
<main class="w-full max-w-md px-margin-mobile md:px-0">
<!-- Header Wordmark -->
<header class="text-center mb-12">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">The Quiet Authority</h1>
</header>
<!-- Auth Card -->
<section class="bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-8 md:p-12">
<!-- Headline -->
<div class="mb-8 text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email</label>
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors duration-200 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Forgot password?</a>
</div>
<input class="w-full px-4 py-3 bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors duration-200 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Sign In Button -->
<button class="w-full py-3 px-4 bg-primary-container text-on-primary font-label-md text-label-md rounded-full hover:bg-primary transition-colors duration-200 flex justify-center items-center" type="submit">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Google Button -->
<button class="w-full py-3 px-4 bg-surface border border-outline-variant text-on-surface font-label-md text-label-md rounded-full hover:bg-surface-variant transition-colors duration-200 flex justify-center items-center gap-2" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Sign in with Google
                </button>
</form>
</section>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Sign Up</a>
</p>
</div>
