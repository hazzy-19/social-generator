<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg shadow-sm p-8 md:p-12">
<!-- Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">The Quiet Authority</h1>
<p class="font-headline-md text-headline-md text-on-surface">Create your account</p>
</div>
<!-- Form -->
<form class="space-y-6">
<div class="space-y-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="fullName">Full Name</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-transparent placeholder:text-outline-variant/70" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="email">Email</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-transparent placeholder:text-outline-variant/70" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Password</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-transparent placeholder:text-outline-variant/70" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary rounded-full py-3 font-label-md text-label-md hover:bg-primary transition-colors" type="button">
                    Create Account
                </button>
</div>
</form>
<div class="my-8 flex items-center justify-center space-x-4">
<div class="h-px bg-outline-variant/50 flex-grow"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or</span>
<div class="h-px bg-outline-variant/50 flex-grow"></div>
</div>
<!-- Secondary Action -->
<button class="w-full border border-outline-variant rounded-full py-3 flex items-center justify-center space-x-2 hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Sign up with Google</span>
</button>
<!-- Footer -->
<div class="mt-8 text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors border-b border-transparent hover:border-primary pb-0.5" href="#">
                Already have an account? Sign In
            </a>
</div>
</div>
