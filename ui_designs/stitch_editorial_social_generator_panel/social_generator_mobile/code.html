<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Social Generator - Mobile Panel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Source+Serif+4:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "primary-fixed-dim": "#aacdce",
                            "on-surface": "#191c20",
                            "surface-dim": "#d9dadf",
                            "secondary-container": "#cbe4e6",
                            "on-tertiary-fixed-variant": "#3e494a",
                            "inverse-surface": "#2e3035",
                            "on-secondary-container": "#506769",
                            "on-tertiary-container": "#7f8b8c",
                            "surface-container-lowest": "#ffffff",
                            "on-tertiary": "#ffffff",
                            "on-secondary-fixed-variant": "#344b4d",
                            "on-primary": "#ffffff",
                            "inverse-primary": "#aacdce",
                            "surface-container-highest": "#e2e2e8",
                            "on-primary-container": "#6d8f90",
                            "secondary-fixed-dim": "#b2cbcd",
                            "surface-container-low": "#f3f3f9",
                            "surface-container-high": "#e7e8ee",
                            "tertiary-fixed-dim": "#bdc9ca",
                            "surface-tint": "#436465",
                            "tertiary": "#030c0d",
                            "background": "#f9f9ff",
                            "tertiary-fixed": "#d9e5e6",
                            "surface": "#f9f9ff",
                            "on-error-container": "#93000a",
                            "surface-variant": "#e2e2e8",
                            "inverse-on-surface": "#f0f0f6",
                            "on-surface-variant": "#414848",
                            "tertiary-container": "#182324",
                            "error": "#ba1a1a",
                            "on-error": "#ffffff",
                            "on-secondary": "#ffffff",
                            "surface-container": "#ededf3",
                            "on-primary-fixed": "#002021",
                            "secondary": "#4b6264",
                            "on-primary-fixed-variant": "#2b4c4d",
                            "primary-container": "#002627",
                            "on-background": "#191c20",
                            "primary-fixed": "#c5e9ea",
                            "error-container": "#ffdad6",
                            "outline": "#717878",
                            "outline-variant": "#c1c8c8",
                            "primary": "#000d0d",
                            "secondary-fixed": "#cee7e9",
                            "on-secondary-fixed": "#071f21",
                            "on-tertiary-fixed": "#131d1e",
                            "surface-bright": "#f9f9ff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                    },
                    "spacing": {
                            "container-max": "1120px",
                            "unit": "4px",
                            "gutter": "24px",
                            "margin-desktop": "64px",
                            "margin-mobile": "20px"
                    },
                    "fontFamily": {
                            "body-md": ["Hanken Grotesk"],
                            "label-sm": ["Hanken Grotesk"],
                            "label-md": ["Hanken Grotesk"],
                            "headline-lg": ["\"Source Serif 4\""],
                            "headline-md": ["\"Source Serif 4\""],
                            "display-lg": ["\"Source Serif 4\""],
                            "body-lg": ["Hanken Grotesk"],
                            "headline-lg-mobile": ["\"Source Serif 4\""]
                    },
                    "fontSize": {
                            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                            "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen">
<!-- Top Navigation (Mobile Bottom Nav hidden for this specific panel view as requested) -->
<!-- Main Content Area -->
<main class="flex flex-col min-h-screen pb-24">
<!-- Header -->
<header class="pt-8 px-5 pb-4 border-b border-outline-variant/30 sticky top-0 bg-surface/95 backdrop-blur-sm z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-1">Social Generator</h1>
<p class="font-label-md text-label-md text-on-surface-variant truncate">Source: The Architecture of Focus and Intentional Living in the Modern Age</p>
</header>
<!-- Platform Tabs (Scrollable Row) -->
<div class="w-full overflow-x-auto scrollbar-hide px-5 py-4 border-b border-outline-variant/30">
<div class="flex gap-2 min-w-max">
<!-- Segmented Control Style Active -->
<button class="bg-surface-variant rounded-full px-4 py-2 flex items-center justify-center relative">
<div class="absolute inset-1 bg-surface rounded-full shadow-sm"></div>
<span class="relative z-10 font-label-sm text-label-sm text-primary flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">public</span> LinkedIn
                    </span>
</button>
<button class="bg-transparent hover:bg-surface-container-low rounded-full px-4 py-2 flex items-center justify-center transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">tag</span> Twitter
                    </span>
</button>
<button class="bg-transparent hover:bg-surface-container-low rounded-full px-4 py-2 flex items-center justify-center transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">photo_camera</span> Instagram
                    </span>
</button>
</div>
</div>
<div class="p-5 flex flex-col gap-6">
<!-- Image Source Pills -->
<div class="flex gap-3">
<button class="bg-primary text-on-primary rounded-full px-4 py-1.5 font-label-sm text-label-sm">Featured</button>
<button class="border border-outline bg-transparent text-on-surface rounded-full px-4 py-1.5 font-label-sm text-label-sm">Generated</button>
</div>
<!-- Preview Image -->
<div class="w-full aspect-[4/3] rounded overflow-hidden border border-outline-variant/20 relative group">
<img class="w-full h-full object-cover" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
<div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<button class="bg-surface/90 text-primary rounded-full p-2 backdrop-blur-sm">
<span class="material-symbols-outlined">crop</span>
</button>
</div>
</div>
<!-- Caption Area -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-primary">Caption</label>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">autorenew</span>
</button>
</div>
<textarea class="w-full h-32 p-3 bg-transparent border border-outline rounded font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 resize-none" placeholder="Write your caption here...">In an era defined by constant interruption, the true luxury is focused attention. Establishing boundaries isn't just about time management; it's about preserving the mental space required for deep, meaningful work. How do you carve out your sanctuary of focus?</textarea>
</div>
<!-- Hashtags -->
<div class="flex flex-wrap gap-2">
<span class="bg-primary-fixed-dim/30 text-on-surface px-3 py-1 rounded-full font-label-sm text-label-sm">#DeepWork</span>
<span class="bg-primary-fixed-dim/30 text-on-surface px-3 py-1 rounded-full font-label-sm text-label-sm">#Focus</span>
<span class="bg-primary-fixed-dim/30 text-on-surface px-3 py-1 rounded-full font-label-sm text-label-sm">#Productivity</span>
<button class="border border-dashed border-outline text-on-surface-variant hover:text-primary px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1 transition-colors">
<span class="material-symbols-outlined text-[14px]">add</span> Add Tag
                </button>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-4">
<button class="w-full bg-primary text-on-primary rounded-full py-3.5 font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined text-[20px]">content_copy</span> Copy Caption
                </button>
<button class="w-full border border-primary text-primary bg-transparent rounded-full py-3.5 font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">download</span> Download Image
                </button>
<button class="w-full border border-primary text-primary bg-transparent rounded-full py-3.5 font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">bookmark</span> Save Draft
                </button>
</div>
</div>
</main>
<style>
        /* Utility to hide scrollbar but keep functionality */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
