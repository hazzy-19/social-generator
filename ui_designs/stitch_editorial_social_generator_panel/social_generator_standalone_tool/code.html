<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-[#f4f4fb] min-h-screen flex items-center justify-center p-4">
<!-- Main Card container -->
<main class="w-full max-w-[520px] bg-surface rounded-lg shadow-sm border border-outline-variant p-6 flex flex-col gap-6 relative">
<!-- Header -->
<header class="flex flex-col gap-1">
<h1 class="font-headline-md text-headline-md text-on-surface">Social Generator</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Paste or write source content, then generate a platform-ready post.</p>
</header>
<!-- Source Content -->
<section class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Source Content</label>
<textarea class="w-full min-h-[120px] bg-surface-container-low border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 resize-y transition-colors duration-200" placeholder="Paste your text or notes here..."></textarea>
</section>
<!-- Divider -->
<div class="h-px w-full bg-outline-variant/30"></div>
<!-- Platform Tabs -->
<section class="flex flex-col gap-3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">PLATFORM</label>
<div class="flex gap-6 border-b border-outline-variant/30 pb-0">
<button class="pb-2 border-b-2 border-primary-container text-primary-container font-label-md text-label-md">Instagram</button>
<button class="pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md">LinkedIn</button>
<button class="pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md">X</button>
<button class="pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md">Facebook</button>
</div>
</section>
<!-- Image Source Toggle & Preview -->
<section class="flex flex-col gap-4">
<div class="flex items-center gap-2">
<div class="flex bg-surface-container p-1 rounded-full border border-outline-variant/20">
<button class="px-4 py-1.5 rounded-full bg-primary-container text-on-primary font-label-sm text-label-sm transition-colors">Featured</button>
<button class="px-4 py-1.5 rounded-full text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm transition-colors">Generated</button>
</div>
</div>
<div class="w-full aspect-[4/3] rounded border border-outline-variant overflow-hidden bg-surface-container-low relative flex items-center justify-center">
<img class="w-full h-full object-cover absolute inset-0" data-alt="A clean, minimalist editorial workspace setup viewed from above. Soft natural light, muted neutral stone-gray tones. A sleek laptop, a small ceramic coffee cup, and scattered paper notes with neat handwriting. The overall aesthetic is focused, quiet, and professional, aligning with a modern minimal design language." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC05EUgecu_oZGKU-hMW4EYdM9Vd9_n51YtdwGcY-UKYYMP8wXNCPd7maKgR0kiwaq6Tg_tFvfNwjySPylfFSLh2gdGFCDP8vaKDy7k5lrHuD5xDJsClA-xLOXippTPp5AuO5scnjSOPorDRAIx7ggwP5cNKToSmekhOO7hgLnXFlcgWdb1Dqo2pjKCul5ABoTG5GOqGTcvbGgc2EI04vgelzDnnyZG9UBrhNDcicmeCnYZBMRQlM0"/>
<span class="material-symbols-outlined text-outline text-4xl relative z-10 hidden">image</span>
</div>
</section>
<!-- Caption Area -->
<section class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Caption</label>
<button class="font-label-sm text-label-sm text-primary-container hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span> Regenerate
                </button>
</div>
<textarea class="w-full bg-surface border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 resize-none overflow-hidden transition-colors duration-200" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="Generated caption will appear here..." style="min-height: 140px; height: auto;">In the pursuit of deep work, removing distractions isn't just about silence—it's about intentional focus. Creating a workspace that reflects clarity helps internalize it. 🖋️

Taking a moment to reset before diving into the next project.</textarea>
<div class="flex justify-between items-center mt-1">
<div class="flex gap-2 flex-wrap">
<span class="px-2 py-1 bg-surface-container-low rounded-full font-label-sm text-label-sm text-on-surface-variant">#DeepWork</span>
<span class="px-2 py-1 bg-surface-container-low rounded-full font-label-sm text-label-sm text-on-surface-variant">#Focus</span>
<span class="px-2 py-1 bg-surface-container-low rounded-full font-label-sm text-label-sm text-on-surface-variant">#Editorial</span>
</div>
<span class="font-label-sm text-label-sm text-outline">242 / 2200</span>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2">
<button class="w-full bg-primary-container text-on-primary py-3 rounded-full font-label-md text-label-md hover:bg-on-primary-fixed transition-colors">
                Copy Caption
            </button>
<div class="flex gap-3">
<button class="flex-1 flex items-center justify-center gap-2 py-2 border border-primary-container text-primary-container rounded-full font-label-sm text-label-sm hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[18px]">download</span> Image
                </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2 border border-primary-container text-primary-container rounded-full font-label-sm text-label-sm hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[18px]">bookmark</span> Save
                </button>
</div>
</div>
</main>
<script>
        // Auto-resize textarea on load
        document.addEventListener('DOMContentLoaded', function() {
            const tx = document.querySelector('textarea[style*="height: auto"]');
            if(tx) {
                tx.style.height = tx.scrollHeight + 'px';
            }
        });
    </script>
</body></html>
